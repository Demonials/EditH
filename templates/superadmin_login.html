<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>🔐 Superadmin Login</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0a0a0f; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: #1a1a2e; padding: 40px; border-radius: 16px; width: 360px; text-align: center; border: 1px solid #ff4444; }
        h1 { color: #ff6b6b; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #333; background: #0d0d1a; color: #fff; }
        button { width: 100%; padding: 12px; background: #ff4444; color: #fff; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
        button:hover { background: #cc0000; }
        .error { color: #ff6b6b; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛡️ Superadmin</h1>
        <form method="POST" action="/superadmin-login">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        <p class="error" id="error">❌ Invalid credentials</p>
        <script>
            if (window.location.search.includes('error=1')) {
                document.getElementById('error').style.display = 'block';
            }
        </script>
    </div>
</body>
</html>
